<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombola</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            height: calc(100vh - 40px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            color: #ff3366;
            margin-bottom: 20px;
            font-size: 1.8em;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
            flex-shrink: 0;
        }

        .setup {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        input[type="number"] {
            padding: 8px 12px;
            border: 2px solid #ff3366;
            border-radius: 8px;
            font-size: 14px;
            width: 120px;
            text-align: center;
            background: #2a2a2a;
            color: #fff;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #ffdd00;
            box-shadow: 0 0 10px rgba(255, 221, 0, 0.3);
        }

        button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff3366, #ff6b6b);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.5);
        }

        .btn-success {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffdd00, #ff9900);
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 221, 0, 0.3);
        }

        .btn-warning:hover {
            box-shadow: 0 6px 20px rgba(255, 221, 0, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #555, #777);
            color: white;
            box-shadow: 0 4px 15px rgba(85, 85, 85, 0.3);
        }

        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(85, 85, 85, 0.5);
        }

        .actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .results {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .results.active {
            display: flex;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #ff3366, #cc0044);
            color: white;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            border: 2px solid #ff6b6b;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.3);
        }

        .stat-value {
            font-size: 1.2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.7em;
            opacity: 0.9;
            margin-top: 2px;
        }

        .tickets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            overflow-y: auto;
            padding: 10px;
            flex: 1;
            min-height: 0;
        }

        .tickets-grid::-webkit-scrollbar {
            width: 10px;
        }

        .tickets-grid::-webkit-scrollbar-track {
            background: #1e1e1e;
            border-radius: 5px;
        }

        .tickets-grid::-webkit-scrollbar-thumb {
            background: #ff3366;
            border-radius: 5px;
        }

        .tickets-grid::-webkit-scrollbar-thumb:hover {
            background: #ff6b6b;
        }

        .ticket {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .ticket:hover {
            border-color: #ff3366;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
        }

        .ticket.done {
            background: #1a3a1a;
            border-color: #00ff88;
            opacity: 0.7;
        }

        .ticket.done:hover {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .ticket-order {
            background: linear-gradient(135deg, #ff3366, #cc0044);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85em;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }

        .ticket.done .ticket-order {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .ticket-number {
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
            flex-grow: 1;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: #00ff88;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-info {
            background: #bee3f8;
            color: #2c5282;
        }

        .icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.8em;
            }
            .tickets-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎫 Tombola</h1>

        <div class="setup" id="setup">
            <input type="number" id="ticketCount" min="1" value="100" placeholder="Nombre de tickets">
            <button class="btn-primary" onclick="startDraw()">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                Nouveau tirage
            </button>
        </div>

        <div class="results" id="results">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalTickets">0</div>
                    <div class="stat-label">Total tickets</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="doneTickets">0</div>
                    <div class="stat-label">Traités</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="remainingTickets">0</div>
                    <div class="stat-label">Restants</div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-secondary" onclick="resetDraw()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M14.59 8L12 10.59 9.41 8 8 9.41 10.59 12 8 14.59 9.41 16 12 13.41 14.59 16 16 14.59 13.41 12 16 9.41 14.59 8zM12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                    Nouveau tirage
                </button>
                <div id="restoreContainer"></div>
            </div>

            <div class="tickets-grid" id="ticketsGrid"></div>
        </div>
    </div>

    <script>
        let currentDraw = null;

        function checkExistingDraw() {
            const saved = localStorage.getItem('tirage');
            if (saved) {
                currentDraw = JSON.parse(saved);
                displayDraw();
            }
        }

        function showRestoreButton() {
            const container = document.getElementById('restoreContainer');
            if (!container) return;
            
            if (!document.getElementById('restoreBtn')) {
                const btn = document.createElement('button');
                btn.className = 'btn-warning';
                btn.innerHTML = `
                    <svg class="icon" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>
                    Restaurer backup
                `;
                btn.onclick = restoreBackup;
                btn.id = 'restoreBtn';
                container.appendChild(btn);
            }
        }

        function restoreBackup() {
            if (confirm('⚠️ ATTENTION : Restaurer le backup effacera définitivement le tirage en cours. Continuer ?')) {
                const backup = localStorage.getItem('tirage.bak');
                if (backup) {
                    localStorage.setItem('tirage', backup);
                    localStorage.removeItem('tirage.bak');
                    currentDraw = JSON.parse(backup);
                    const restoreBtn = document.getElementById('restoreBtn');
                    if (restoreBtn) restoreBtn.remove();
                    displayDraw();
                }
            }
        }

        function startDraw() {
            const count = parseInt(document.getElementById('ticketCount').value);
            if (!count || count < 1) {
                alert('Veuillez entrer un nombre valide');
                return;
            }

            const existing = localStorage.getItem('tirage');
            if (existing) {
                localStorage.setItem('tirage.bak', existing);
                showRestoreButton();
            }

            const numbers = Array.from({length: count}, (_, i) => i + 1);
            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }

            currentDraw = {
                total: count,
                timestamp: new Date().toISOString(),
                tickets: numbers.map((num, idx) => ({
                    order: idx + 1,
                    number: num,
                    done: false
                }))
            };

            saveDraw();
            displayDraw();
        }

        function displayDraw() {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('results').classList.add('active');
            
            document.getElementById('totalTickets').textContent = currentDraw.total;
            updateStats();

            const backup = localStorage.getItem('tirage.bak');
            if (backup) {
                showRestoreButton();
            }

            const grid = document.getElementById('ticketsGrid');
            grid.innerHTML = '';

            currentDraw.tickets.forEach((ticket, idx) => {
                const div = document.createElement('div');
                div.className = `ticket ${ticket.done ? 'done' : ''}`;
                div.onclick = () => toggleTicket(idx);
                div.innerHTML = `
                    <div class="ticket-order">${ticket.order}</div>
                    <div class="ticket-number">#${ticket.number}</div>
                    <input type="checkbox" class="checkbox" ${ticket.done ? 'checked' : ''}>
                `;
                grid.appendChild(div);
            });
        }

        function toggleTicket(idx) {
            currentDraw.tickets[idx].done = !currentDraw.tickets[idx].done;
            saveDraw();
            displayDraw();
        }

        function updateStats() {
            const done = currentDraw.tickets.filter(t => t.done).length;
            document.getElementById('doneTickets').textContent = done;
            document.getElementById('remainingTickets').textContent = currentDraw.total - done;
        }

        function saveDraw() {
            localStorage.setItem('tirage', JSON.stringify(currentDraw));
        }

        function resetDraw() {
            if (confirm('Voulez-vous vraiment recommencer un nouveau tirage ?')) {
                currentDraw = null;
                document.getElementById('setup').style.display = 'flex';
                document.getElementById('results').classList.remove('active');
            }
        }

        checkExistingDraw();
    </script>
</body>
</html>
